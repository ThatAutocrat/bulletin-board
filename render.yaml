services:
  - type: web
    name: neighbourhood-board
    runtime: go
    buildCommand: go build -o server ./cmd/main.go
    startCommand: ./server
    envVars:
      - key: PORT
        value: 8080
      - key: DB_PATH
        value: /data/bulletin.db
    disk:
      name: sqlite-data
      mountPath: /data
      sizeGB: 1
